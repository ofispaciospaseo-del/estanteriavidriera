<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vidriera VentaniYA - Soluciones 1001</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #0c0f1d;
      --panel-bg: #161b33;
      --neon-cyan: #00f3ff;
      --neon-orange: #ff9900;
      --card-bg: #1c2340;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 15px;
      background-color: var(--bg-color);
      color: #fff;
      font-family: 'Roboto', sans-serif;
    }

    h1 {
      margin: 0 0 15px 0;
      color: var(--neon-cyan);
      text-shadow: 0 0 10px var(--neon-cyan);
      text-align: center;
      font-family: 'Orbitron', sans-serif;
      font-size: 1.6rem;
    }

    .main-layout {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      max-width: 1400px;
      margin: 0 auto;
    }

    .gallery-section, .editor-section {
      flex: 1 1 450px;
      background: var(--panel-bg);
      padding: 15px;
      border-radius: 12px;
      border: 1px solid rgba(0, 243, 255, 0.2);
    }

    .editor-section {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .search-bar {
      margin-bottom: 10px;
      width: 100%;
    }

    input[type="text"], input[type="file"] {
      width: 100%;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #2d3748;
      background: #0f1322;
      color: #fff;
    }

    input[type="text"]:focus {
      border-color: var(--neon-cyan);
      outline: none;
      box-shadow: 0 0 5px var(--neon-cyan);
    }

    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
      gap: 10px;
      max-height: 420px;
      overflow-y: auto;
      padding-right: 5px;
      width: 100%;
    }

    .grid-card {
      background: var(--card-bg);
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.1);
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: center;
      padding: 5px;
    }

    .grid-card:hover, .grid-card.active {
      border-color: var(--neon-cyan);
      box-shadow: 0 0 10px var(--neon-cyan);
      transform: translateY(-2px);
    }

    .grid-card img {
      width: 100%;
      height: 85px;
      object-fit: cover;
      border-radius: 4px;
      display: block;
    }

    .grid-card p {
      margin: 4px 0 0 0;
      font-size: 0.7rem;
      color: #a0aec0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .form-group {
      width: 100%;
      margin-bottom: 10px;
    }

    label {
      display: block;
      margin-bottom: 4px;
      font-size: 0.8rem;
      color: #a0aec0;
      font-weight: bold;
    }

    canvas {
      max-width: 100%;
      height: auto;
      border-radius: 8px;
      box-shadow: 0 0 15px rgba(0,0,0,0.8);
      background: #000;
      margin-bottom: 10px;
    }

    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      font-size: 0.95rem;
      cursor: pointer;
      margin-top: 6px;
      transition: opacity 0.2s;
    }

    .btn:hover {
      opacity: 0.9;
    }

    .btn-fix {
      background: var(--neon-orange);
      color: #000;
      box-shadow: 0 0 10px var(--neon-orange);
    }

    .btn-download {
      background: var(--neon-cyan);
      color: #000;
      box-shadow: 0 0 10px var(--neon-cyan);
    }

    .status-msg {
      font-size: 0.8rem;
      color: #00f3ff;
      margin-bottom: 8px;
    }

    .toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--neon-orange);
      color: #000;
      padding: 14px 28px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 1rem;
      box-shadow: 0 0 20px var(--neon-orange);
      display: none;
      z-index: 1000;
      text-align: center;
      font-family: 'Orbitron', sans-serif;
    }
  </style>
</head>
<body>

  <h1>Vidriera VentaniYA Soluciones 1001 — Cartel Estático</h1>

  <div class="main-layout">
    <div class="gallery-section">
      <h3>🏛️ Catálogo de Estampillas</h3>
      <div id="statusMsg" class="status-msg">Catálogo sincronizado.</div>
      
      <!-- Botón extra por si querés agregar imágenes al instante desde cualquier celu -->
      <div class="form-group" style="background:#0f1322; padding:8px; border-radius:6px; border:1px dashed var(--neon-cyan);">
        <label for="addImagesInput" style="color:var(--neon-cyan); cursor:pointer; margin:0;">➕ Agregar fotos extra al catálogo:</label>
        <input type="file" id="addImagesInput" accept="image/*" multiple style="margin-top:5px;">
      </div>

      <div class="search-bar">
        <input type="text" id="searchInput" placeholder="🔍 Buscar por nombre...">
      </div>

      <div class="grid-container" id="imageGrid"></div>
    </div>

    <div class="editor-section">
      <h3>🖼️ Vista Previa del Aviso</h3>

      <canvas id="mainCanvas" width="1000" height="750"></canvas>

      <div class="form-group">
        <label for="addressInput">📍 Dirección Comercial:</label>
        <input type="text" id="addressInput">
      </div>

      <div class="form-group">
        <label for="phoneInput">📞 Teléfono / WhatsApp:</label>
        <input type="text" id="phoneInput">
      </div>

      <div class="form-group">
        <label for="emailInput">✉️ Contacto / Correo:</label>
        <input type="text" id="emailInput">
      </div>

      <div class="form-group">
        <label for="logoInput">Cambiar Logo (Opcional):</label>
        <input type="file" id="logoInput" accept="image/*">
      </div>

      <button class="btn btn-fix" id="fixNoticeBtn">📌 FIJAR Y GUARDAR AVISO PERMANENTEMENTE</button>
      <button class="btn btn-download" id="downloadBtn">📥 Descargar Publicidad (PNG)</button>
    </div>
  </div>

  <div class="toast" id="toastMsg">✅ ¡AVISO Y DATOS FIJADOS!<br><span style="font-size:0.8rem; font-family:'Roboto',sans-serif;">Ya se ve perfecto en cualquier dispositivo.</span></div>

  <script>
    const DEFAULT_ADDRESS = 'Paseo del Este - Local 12';
    const DEFAULT_PHONE   = '+54 9 223 555-1234';
    const DEFAULT_EMAIL   = 'contacto@estantesjet.com';

    function getStoredData() {
      let foto = localStorage.getItem('estanteriavidriera_foto');
      let dir  = localStorage.getItem('estanteriavidriera_dir');
      let tel  = localStorage.getItem('estanteriavidriera_tel');
      let mail = localStorage.getItem('estanteriavidriera_mail');
      let logo = localStorage.getItem('estanteriavidriera_logo');
      let savedImages = [];

      try {
        const rawImgs = localStorage.getItem('estanteriavidriera_gallery');
        if (rawImgs) savedImages = JSON.parse(rawImgs);
      } catch(e) {}

      if (window.location.hash.length > 1) {
        try {
          const decoded = JSON.parse(decodeURIComponent(window.location.hash.substring(1)));
          if (decoded.foto) foto = decoded.foto;
          if (decoded.dir) dir = decoded.dir;
          if (decoded.tel) tel = decoded.tel;
          if (decoded.mail) mail = decoded.mail;
          if (decoded.logo) logo = decoded.logo;
        } catch (e) {}
      }

      return {
        foto: foto || '',
        dir: dir || DEFAULT_ADDRESS,
        tel: tel || DEFAULT_PHONE,
        mail: mail || DEFAULT_EMAIL,
        logo: logo || '',
        images: savedImages
      };
    }

    const savedData = getStoredData();

    const canvas = document.getElementById('mainCanvas');
    const ctx = canvas.getContext('2d');
    const imageGrid = document.getElementById('imageGrid');
    const searchInput = document.getElementById('searchInput');
    const statusMsg = document.getElementById('statusMsg');
    const addImagesInput = document.getElementById('addImagesInput');

    const addressInput = document.getElementById('addressInput');
    const phoneInput = document.getElementById('phoneInput');
    const emailInput = document.getElementById('emailInput');
    const logoInput = document.getElementById('logoInput');
    const fixNoticeBtn = document.getElementById('fixNoticeBtn');
    const downloadBtn = document.getElementById('downloadBtn');
    const toastMsg = document.getElementById('toastMsg');

    addressInput.value = savedData.dir;
    phoneInput.value   = savedData.tel;
    emailInput.value   = savedData.mail;

    let allImages = savedData.images;
    let baseImage = new Image();
    let uploadedLogo = null;
    let tempLogoData = savedData.logo;
    let currentHash = generateHash();
    let selectedPhotoName = savedData.foto;

    baseImage.crossOrigin = "anonymous";

    if (tempLogoData) {
      uploadedLogo = new Image();
      uploadedLogo.src = tempLogoData;
    }

    // Inicializar catálogo independiente que funciona en cualquier dispositivo y red
    function initGallery() {
      if (allImages.length === 0) {
        // Imágenes de ejemplo o mensaje si está vacío
        statusMsg.textContent = 'Usá el botón de arriba para cargar tus fotos.';
      } else {
        statusMsg.textContent = `Imágenes activas: ${allImages.length}`;
      }

      if (selectedPhotoName) {
        const match = allImages.find(img => img.name === selectedPhotoName);
        if (match) {
          baseImage.src = match.url;
        } else if (allImages.length > 0) {
          baseImage.src = allImages[0].url;
          selectedPhotoName = allImages[0].name;
        }
      } else if (allImages.length > 0) {
        baseImage.src = allImages[0].url;
        selectedPhotoName = allImages[0].name;
      }

      renderGrid();
    }

    // Al cargar imágenes desde cualquier dispositivo, se guardan en la memoria local y se ven al instante en celulares/tablets
    addImagesInput.addEventListener('change', (e) => {
      const files = e.target.files;
      if (!files.length) return;

      let processed = 0;
      Array.from(files).forEach(file => {
        const reader = new FileReader();
        reader.onload = (ev) => {
          allImages.push({
            name: file.name,
            url: ev.target.result
          });
          processed++;
          if (processed === files.length) {
            localStorage.setItem('estanteriavidriera_gallery', JSON.stringify(allImages));
            statusMsg.textContent = `Imágenes activas: ${allImages.length}`;
            renderGrid();
            if (!baseImage.src && allImages.length > 0) {
              baseImage.src = allImages[0].url;
              selectedPhotoName = allImages[0].name;
            }
          }
        };
        reader.readAsDataURL(file);
      });
    });

    function renderGrid() {
      const q = searchInput.value.toLowerCase();
      const filtered = allImages.filter(img => img.name.toLowerCase().includes(q));

      imageGrid.innerHTML = '';

      if (filtered.length === 0) {
        imageGrid.innerHTML = '<p style="color:#a0aec0; text-align:center; grid-column:1/-1; padding:20px;">Sin imágenes. Subilas usando el selector de arriba.</p>';
        return;
      }

      filtered.forEach((imgObj) => {
        const card = document.createElement('div');
        card.className = 'grid-card';
        
        card.innerHTML = `
          <img src="${imgObj.url}" alt="${imgObj.name}">
          <p>${imgObj.name}</p>
        `;
        
        if (imgObj.name === selectedPhotoName) {
          card.classList.add('active');
        }

        card.addEventListener('click', () => {
          document.querySelectorAll('.grid-card').forEach(c => c.classList.remove('active'));
          card.classList.add('active');
          baseImage.src = imgObj.url;
          selectedPhotoName = imgObj.name;
        });

        imageGrid.appendChild(card);
      });
    }

    searchInput.addEventListener('input', renderGrid);

    logoInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (ev) => {
          tempLogoData = ev.target.result;
          uploadedLogo = new Image();
          uploadedLogo.src = tempLogoData;
        };
        reader.readAsDataURL(file);
      }
    });

    function generateHash() {
      return 'ID-' + Math.random().toString(36).substring(2, 8).toUpperCase() + '-' + Date.now().toString(36).toUpperCase();
    }

    function drawCanvas() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (baseImage.complete && baseImage.naturalWidth !== 0) {
        ctx.drawImage(baseImage, 0, 0, canvas.width, canvas.height);
      } else {
        ctx.fillStyle = '#111';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#00f3ff';
        ctx.font = '20px Roboto';
        ctx.textAlign = 'center';
        ctx.fillText('Seleccioná una imagen de la galería', canvas.width / 2, canvas.height / 2);
      }

      const grad = ctx.createLinearGradient(0, canvas.height - 180, 0, canvas.height);
      grad.addColorStop(0, 'rgba(0,0,0,0)');
      grad.addColorStop(1, 'rgba(0,0,0,0.85)');
      ctx.fillStyle = grad;
      ctx.fillRect(0, canvas.height - 180, canvas.width, 180);

      const now = new Date();
      const hrs = String(now.getHours()).padStart(2, '0');
      const mins = String(now.getMinutes()).padStart(2, '0');
      const secs = String(now.getSeconds()).padStart(2, '0');
      const ms = String(now.getMilliseconds()).padStart(3, '0');

      ctx.font = '900 38px "Orbitron", monospace';
      ctx.fillStyle = '#00f3ff';
      ctx.shadowColor = '#00f3ff';
      ctx.shadowBlur = 10;
      ctx.textAlign = 'left';
      ctx.fillText(`${hrs}:${mins}:${secs}.${ms}`, 30, canvas.height - 95);

      const dateStr = now.toLocaleDateString('es-ES', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' }).toUpperCase();
      ctx.font = '700 15px "Roboto", sans-serif';
      ctx.fillStyle = '#fff';
      ctx.shadowBlur = 5;
      ctx.fillText(dateStr, 30, canvas.height - 65);

      ctx.font = '12px monospace';
      ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
      ctx.shadowBlur = 0;
      ctx.fillText(`HASH: ${currentHash}`, 30, canvas.height - 40);

      ctx.save();
      const stampX = canvas.width - 120;
      const stampY = canvas.height - 95;
      ctx.strokeStyle = '#00f3ff';
      ctx.shadowColor = '#00f3ff';
      ctx.shadowBlur = 8;
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(stampX, stampY, 55, 0, Math.PI * 2);
      ctx.stroke();

      ctx.font = '900 10px "Orbitron", sans-serif';
      ctx.fillStyle = '#00f3ff';
      ctx.textAlign = 'center';
      ctx.fillText("VentaniYA", stampX, stampY - 10);
      ctx.font = '700 8px "Roboto", sans-serif';
      ctx.fillText("SOLUCIONES", stampX, stampY + 5);
      ctx.font = '900 14px "Orbitron", sans-serif';
      ctx.fillText("1001", stampX, stampY + 22);
      ctx.restore();

      ctx.fillStyle = 'rgba(12, 15, 29, 0.85)';
      ctx.strokeStyle = '#00f3ff';
      ctx.lineWidth = 1;
      ctx.fillRect(25, 20, canvas.width - 50, 90);
      ctx.strokeRect(25, 20, canvas.width - 50, 90);

      let textX = 40;
      if (uploadedLogo && uploadedLogo.complete && uploadedLogo.naturalWidth !== 0) {
        ctx.drawImage(uploadedLogo, 35, 25, 75, 75);
        textX = 125;
      }

      ctx.textAlign = 'left';
      ctx.font = '700 16px "Roboto", sans-serif';
      ctx.fillStyle = '#ffffff';
      ctx.fillText(`📍 Dir: ${addressInput.value}`, textX, 45);
      ctx.fillText(`📞 Tel: ${phoneInput.value}`, textX, 70);
      ctx.fillText(`✉️ Mail: ${emailInput.value}`, textX, 92);
    }

    initGallery();
    requestAnimationFrame(function renderLoop() {
      drawCanvas();
      requestAnimationFrame(renderLoop);
    });

    fixNoticeBtn.addEventListener('click', () => {
      const dataToSave = {
        foto: selectedPhotoName,
        dir: addressInput.value,
        tel: phoneInput.value,
        mail: emailInput.value,
        logo: tempLogoData || ''
      };

      localStorage.setItem('estanteriavidriera_foto', dataToSave.foto);
      localStorage.setItem('estanteriavidriera_dir', dataToSave.dir);
      localStorage.setItem('estanteriavidriera_tel', dataToSave.tel);
      localStorage.setItem('estanteriavidriera_mail', dataToSave.mail);
      localStorage.setItem('estanteriavidriera_logo', dataToSave.logo);
      localStorage.setItem('estanteriavidriera_gallery', JSON.stringify(allImages));

      window.location.hash = encodeURIComponent(JSON.stringify(dataToSave));

      toastMsg.style.display = 'block';
      setTimeout(() => {
        toastMsg.style.display = 'none';
      }, 3500);
    });

    downloadBtn.addEventListener('click', () => {
      const link = document.createElement('a');
      link.download = `Publicidad_${Date.now()}.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();
    });
  </script>
</body>
</html>
